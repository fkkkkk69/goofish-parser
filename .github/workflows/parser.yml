on:
  workflow_dispatch:
    inputs:
      silent:
        description: 'Тихий запуск: пометить найденное как виденное без уведомлений'
        type: boolean
        default: false

concurrency:
  group: goofish-parser-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Restore login session
        env:
          STATE_JSON_B64: ${{ secrets.STATE_JSON_B64 }}
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          raw = base64.b64decode(os.environ["STATE_JSON_B64"])
          try:
              data = gzip.decompress(raw)
          except OSError:
              # Backward-compatible with an uncompressed Base64 state.
              data = raw

          Path("state.json").write_bytes(data)
          print(f"Restored state.json: {len(data)} bytes")
          PY
      - run: python parser.py ${{ inputs.silent && '--silent' || '' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}
      - name: Save seen.json back to repo
        run: |
          rm -f state.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen.json last_run.json
          git diff --staged --quiet || git commit -m "Update seen items [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && break
            sleep 5
          done
